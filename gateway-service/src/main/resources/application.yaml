server:
  port: 8888

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      # ===== ĐỊNH NGHĨA CÁC ROUTE =====
      routes:
        # Route 1: /identity/** → identity-service
        - id: identity-service-route
          uri: http://localhost:8090
          predicates:
            - Path=/identity/**
          filters:
            - StripPrefix=1        # Bỏ /identity trước khi forward

        # Route 2: /product/** → identity-service (test multi-service)
        - id: product-service-route
          uri: http://localhost:8090
          predicates:
            - Path=/product/**
          filters:
            - StripPrefix=1

      # ===== CORS =====
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

# ===== LOGGING =====
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: INFO
    reactor.netty: INFO